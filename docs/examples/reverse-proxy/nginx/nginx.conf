# Reference nginx edge for ovumcy-sync-community. Adapt server_name and the
# certificate paths; see README.md in this directory.
#
# Mount as /etc/nginx/conf.d/default.conf (a conf.d file, so the http context
# is implicit). "ovumcy-sync-community" is the app's compose service name; the
# app listens on :8080.

upstream ovumcy_sync {
    server ovumcy-sync-community:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name sync.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sync.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The app accepts a PUT /sync/blob body of up to ~21.3 MiB with the default
    # MAX_BLOB_BYTES=16 MiB (base64 in JSON). 32m leaves headroom; raise it in
    # step with MAX_BLOB_BYTES.
    client_max_body_size 32m;

    # Keep these at or above the app's HTTP_READ_TIMEOUT (default 10s) and
    # HTTP_WRITE_TIMEOUT (default 15s) so the proxy is not the first to cut a
    # slow upload.
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Never expose the metrics endpoint publicly (matches the Caddy example).
    location = /metrics {
        default_type text/plain;
        return 403 "metrics_not_exposed";
    }

    location / {
        proxy_pass http://ovumcy_sync;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Overwrite, never append: $remote_addr is the address nginx accepted
        # the connection from. Do not use $proxy_add_x_forwarded_for here, it
        # would keep whatever the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
