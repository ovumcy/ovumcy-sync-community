services:
  ovumcy-sync-community:
    # Caddy is the only peer whose X-Forwarded-For is trusted, so per-client
    # auth rate limiting keys on real client IPs instead of one shared bucket.
    environment:
      TRUSTED_PROXY_CIDRS: "${SYNC_PROXY_IP:-172.30.99.10}/32"
    # Drops the base file's 127.0.0.1:8080 mapping, so nothing on the host
    # reaches the app around Caddy's /metrics and /managed/* block
    # (needs Docker Compose 2.24.4 or newer).
    ports: !reset []
    networks:
      - edge

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      - ovumcy-sync-community
    environment:
      # A hostname makes Caddy obtain a certificate and serve HTTPS; there is
      # deliberately no default, since a bare port would serve plain HTTP.
      SYNC_SITE_ADDRESS: "${SYNC_SITE_ADDRESS:?set SYNC_SITE_ADDRESS to the public hostname, e.g. sync.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    # Caddy runs as root in its image and binds 80/443: that is the one
    # capability it keeps.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      edge:
        ipv4_address: "${SYNC_PROXY_IP:-172.30.99.10}"
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: "${SYNC_EDGE_SUBNET:-172.30.99.0/24}"

volumes:
  caddy-data:
  caddy-config:
