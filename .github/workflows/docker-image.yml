name: Docker Image

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    # Job-local staging registry: the image is built and pushed HERE first,
    # verified, promoted to GHCR by digest, and signed before any consumable
    # tag exists. The registry dies with the job, so nothing unverified
    # outlives the run. Previously the build pushed straight to GHCR and the
    # verify/sign steps ran after publication — a red verify or a signing
    # failure left an already-public unsigned image behind.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the main-lineage gate below compares against
          # origin/main, which a shallow single-ref checkout does not have.
          fetch-depth: 0

      # Publication gate. This workflow triggers on v* tags and on
      # workflow_dispatch, and no test or security workflow has a tag
      # trigger — so without this step a tag pushed onto ANY commit publishes
      # an image that never ran a single check. Branch protection gates main;
      # requiring main ancestry extends that gate to every publish path.
      - name: Refuse to publish a commit that is not on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::refusing to publish: $GITHUB_SHA is not reachable from origin/main; only commits gated by the protected branch may publish images"
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # The buildkit container must reach the job-service registry on the
          # runner's localhost:5000.
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push to the job-local staging registry
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: localhost:5000/ovumcy-sync-community:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify per-platform binary architecture
        run: |
          set -euo pipefail
          image="localhost:5000/ovumcy-sync-community@${{ steps.build.outputs.digest }}"
          verify() {
            platform="$1"
            want="$2"
            tag="bin-$(echo "$platform" | tr / -)"
            # Pull the per-platform manifest by ITS OWN digest. Pulling the
            # multi-platform digest once per platform fails on the second one
            # with "cannot overwrite digest": the local store binds that digest
            # to whichever platform arrived first, and a second --platform pull
            # of the same reference has nowhere to go.
            # Exported Go struct fields, not JSON names: .Platform.architecture
            # fails with "can't evaluate field architecture in type
            # *v1.Platform" — that typo kept this step red on every run since
            # it was introduced, and with push-before-verify each of those red
            # runs had already published an unverified, unsigned image.
            digest=$(docker buildx imagetools inspect "$image" \
              --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${platform#linux/}\"}}{{if eq .Platform.OS \"linux\"}}{{println .Digest}}{{end}}{{end}}{{end}}" \
              | head -n 1)
            if [ -z "$digest" ]; then
              echo "::error::no $platform manifest in $image"
              exit 1
            fi
            ref="localhost:5000/ovumcy-sync-community@$digest"
            docker pull --platform "$platform" "$ref"
            cid=$(docker create --platform "$platform" "$ref")
            docker cp "$cid:/app/ovumcy-sync-community" "./$tag"
            docker rm "$cid" >/dev/null
            got=$(file "./$tag")
            echo "$platform -> $got"
            echo "$got" | grep -q "$want" || { echo "::error::$platform binary is not $want: $got"; exit 1; }
          }
          verify linux/amd64 x86-64
          verify linux/arm64 aarch64

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Digest-preserving promote (skopeo --preserve-digests fails rather than
      # rewrite), under a holding tag no consumer pulls, then the signature.
      # Order matters: when signing fails, the run goes red with nothing
      # consumable published — previously the same failure left an unsigned
      # image behind the real tags.
      - name: Promote the verified digest to GHCR and sign it
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          dest_repo="ghcr.io/${{ github.repository }}"
          skopeo copy --all --preserve-digests --src-tls-verify=false \
            "docker://localhost:5000/ovumcy-sync-community@${digest}" \
            "docker://${dest_repo}:publish-candidate"
          cosign sign --yes "${dest_repo}@${digest}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Both SBOM formats ship, each attested on the same digest.
      #
      # Which of the two a consumer's scanner or policy engine ingests is not
      # the publisher's choice, and converting is not a free substitute: a
      # consumer who converts the one document published here into the format
      # their tooling reads is no longer holding an attested artifact, because
      # the attestation covers the bytes syft emitted and not a rendering
      # derived from them afterwards. Publishing both keeps the document that
      # was verified and the document that gets ingested the same file either
      # way.
      #
      # Both are generated from the PROMOTED digest rather than from a local
      # build output, so each inventory describes exactly the bytes the release
      # tags will resolve to. Syft flattens the multi-platform index to the
      # runner's own platform (linux/amd64); the inventory does not vary across
      # the two here — one CGO_ENABLED=0 static binary from a single module
      # graph, over a distroless/static base whose package set is identical per
      # architecture.
      - name: Generate the SPDX image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The attestation below is this document's distribution channel. A
          # second copy as a run artifact or a release asset would be an
          # unsigned one, published from the same run under the same name.
          upload-artifact: false
          upload-release-assets: false

      # Same fail-closed position as the provenance attestation above it: the
      # SBOM is attached to the index digest in the registry, and a failure
      # here ends the run before any consumable tag exists. Signed with the
      # permissions the job already holds — attestations:write and
      # id-token:write to mint it, packages:write to push it.
      - name: Attest the SPDX SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # The same inventory in the other format, read off the image a second
      # time rather than converted from the document above — so each attested
      # document is one syft produced directly from the promoted digest.
      - name: Generate the CycloneDX image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # actions/attest reads the predicate type off the document itself:
      # https://spdx.dev/Document/v2.3 for the SPDX pair above and
      # https://cyclonedx.org/bom here. Both attestations carry the same
      # subject digest and both sit ahead of "Attach the release tags", so a
      # failure to describe or to attest in either format ends the run while
      # the only tag on the image is the holding tag no consumer pulls.
      # Verification is documented in docs/self-hosting.md; the predicate type
      # is what selects between the three attestations on the digest, so those
      # commands and these two formats move together.
      - name: Attest the CycloneDX SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      # Consumable tags appear only after verify + sign + attest all passed.
      # Manifest-only copies within the same repository: the blobs are already
      # there from the promote step.
      - name: Attach the release tags
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          dest_repo="ghcr.io/${{ github.repository }}"
          printf '%s\n' "$META_TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests \
              "docker://${dest_repo}@${digest}" "docker://${tag}"
          done
