# Dependabot keeps Go modules, GitHub Actions (SHA pins), and the Docker base
# image current between manual review passes.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Images in the compose files and the Traefik example are digest-pinned too.
  - package-ecosystem: "docker-compose"
    directories: ["/", "/docs/examples/reverse-proxy/traefik"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The ClusterFuzzLite build base is digest-pinned (OpenSSF Scorecard
  # Pinned-Dependencies); keep that pin maintained instead of letting it rot.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
