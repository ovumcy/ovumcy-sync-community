openapi: 3.1.0
info:
  title: ovumcy-sync-community
  version: "0.3.0"
  description: |
    Self-hosted, zero-knowledge encrypted-sync backend for the Ovumcy app.

    The server stores only account/session/device metadata and ciphertext blobs.
    It never receives cycle dates, symptoms, notes, recovery phrases, client
    master keys, or decrypted sync payloads — sync blobs and recovery-key
    packages are accepted and returned as opaque base64/hex payloads plus
    metadata only.

    This document is generated from the actual Go handlers and request/response
    structs in `internal/api/server.go` (every `s.handleRoute(...)` registration)
    and the service-layer result types they return. It intentionally omits
    ciphertext content shapes beyond "opaque base64/hex string" to respect the
    zero-knowledge contract.

    Every route, any method: a request whose `Origin` header is not in
    `ALLOWED_ORIGINS` answers `403 origin_not_allowed` (no CORS headers) before
    any rate limiter is charged — the `OriginNotAllowed` response, not repeated
    per operation. So does a request without `Origin` whose `Sec-Fetch-Site` is
    `cross-site` or `same-site`, except on `/healthz`, `/readyz` and `/metrics`.

    A request with neither an `Origin` nor a `Sec-Fetch-Site` header (native
    clients, server-to-server callers, probes) passes those two checks.

    The host gate is separate and has no such exemption. When `ALLOWED_HOSTS`
    is set, every request whose `Host` (port ignored) is not listed, is not an
    IP literal and is not `localhost` answers `403 host_not_allowed` ahead of
    the origin check and every rate limiter — the `HostNotAllowed` response,
    not repeated per operation. A managed-bridge caller that reaches the
    server by a name such as a compose service name is therefore refused
    unless that name is listed.

    Request bodies are JSON and capped: 4 KiB on every body-taking route
    except the two recovery-key routes (`PUT /sync/recovery-key`,
    `PUT /managed/accounts/{account_id}/recovery-key`), which allow 8 KiB, and
    `PUT /sync/blob`, which allows base64(`MAX_BLOB_BYTES`) plus 8 KiB. A body
    over its cap, malformed JSON, an unknown field, an empty body or data after
    the first JSON value all answer `400 invalid_json` (the `InvalidJSON`
    response, listed on each body-taking operation). A request with a body
    that is not declared `Content-Type: application/json` answers
    `415 unsupported_media_type` on any route, including routes that read no
    body, before any rate limiter.

    `PUT /sync/blob`, `GET /sync/blob` and `PUT /sync/rekey` share a server-wide limit of 4
    transfers in progress. A further transfer waits for a free slot before its
    body is read or its blob loaded, for at most a quarter of the shorter of the
    server's HTTP read/write timeouts and never over 2 seconds; a transfer still
    waiting then answers `503 blob_transfer_busy` with `Retry-After` (the
    `BlobTransferBusy` response) and may be retried. An account has at most
    one of these transfers in progress or waiting: a second one answers the
    same `503 blob_transfer_busy` at once, without waiting. A refused
    transfer takes no slot and parses no body, and still counts against the
    sync rate limit.

    Outside the JSON error envelope: an unknown path or a method the path does
    not take gets the standard library's plain-text `404` / `405` (the latter
    with an `Allow` header), and `OPTIONS` answers a bare `204` with no body.
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
externalDocs:
  description: Project README
  url: https://github.com/ovumcy/ovumcy-sync-community#readme

servers:
  - url: http://localhost:8080
    description: Local / self-hosted default bind address

security: []

tags:
  - name: health
    description: Liveness, readiness, and operator metrics.
  - name: auth
    description: Registration, login, password/recovery-code management, TOTP 2FA, and session lifecycle.
  - name: sync
    description: Device registry, encrypted blob storage (one blob per account, shared by its devices), and the wrapped recovery-key package. Authenticated and account-scoped.
  - name: managed-bridge
    description: Machine-to-machine bridge for the separate managed-cloud service. Disabled unless MANAGED_BRIDGE_TOKEN is configured.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      description: >-
        Always returns 200 while the process is up. No auth, no dependency
        checks. Intended for a proxy or uptime check that only needs to know
        the HTTP loop is alive; it cannot detect an unusable database, so the
        container healthcheck probes /readyz instead.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe
      description: >-
        Checks the database: it must answer, and the schema it holds must be
        the one this build embeds. A database migrated past this build by a
        newer image is not ready, so an old binary left running against an
        upgraded volume stops reporting itself as serviceable. This is what
        the container HEALTHCHECK probes.
      security: []
      responses:
        "200":
          description: Server is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Readiness check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notReady:
                  value: { error: not_ready }

  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Only registered when `METRICS_ENABLED=true`; otherwise every request to
        this path returns 404. Startup refuses `METRICS_ENABLED=true` without
        `METRICS_BEARER_TOKEN`, so a matching `Authorization: Bearer <token>`
        header is always required.
      security:
        - metricsBearerAuth: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Metrics enabled with a bearer token configured, and the request's token did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "404":
          description: Metrics are not enabled on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value: { error: not_found }

  /auth/register:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: Register a new account
      description: |
        Creates an account and an initial session in one call. The plaintext
        account-level recovery code is returned only in this response — it is
        never retrievable again, only rotated.

        An operator closes registration with `REGISTRATION_ENABLED=false`
        (recommended once the server's own account exists); the route then
        answers `403 registration_disabled` before reading the body, without
        hashing a password or spending a rate-limit slot.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "201":
          description: Account created; session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid login/password, the login is already taken, or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                invalidInput:
                  value: { error: invalid_registration_input }
                registrationFailed:
                  value: { error: registration_failed }
        "403":
          description: Registration is closed on this server (`REGISTRATION_ENABLED=false`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                registrationDisabled:
                  value: { error: registration_disabled }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with login + password
      description: |
        On success for an account without TOTP enabled, returns a session
        token immediately. On success for a TOTP-enabled account, returns a
        `totp_challenge` instead — the two response shapes are mutually
        exclusive; a session token is never returned alongside a challenge.
        The caller must then complete `POST /auth/totp/challenge`.
        A session minted past `MAX_SESSIONS_PER_ACCOUNT` (default the larger
        of 10 and twice `MAX_DEVICES`) revokes the account's oldest sessions
        beyond it, whose tokens then answer 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Login succeeded — either a session, or a pending TOTP challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Unknown login or wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value: { error: invalid_credentials }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Account has TOTP enabled but the server has no FIELD_ENCRYPTION_KEY configured; fails closed instead of a password-only downgrade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                totpNotConfigured:
                  value: { error: totp_not_configured }

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the account password
      description: |
        Requires the current password and, on a TOTP-enrolled account, a
        current TOTP `code` (the new recovery code can reset the password and
        clear TOTP, so the password alone must not obtain one). The code
        attempt counts toward the step-up TOTP budget. On success the
        recovery code is rotated — the response carries the new one and the
        previous one stops working — every other session for the account is
        revoked (the caller's own session token stays valid), and pending
        TOTP login challenges and password-reset tokens are deleted.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; the recovery code was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedResponse"
        "400":
          description: New password fails the strength check, equals the current password, or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                mustDiffer:
                  value: { error: new_password_must_differ }
                weak:
                  value: { error: weak_new_password }
        "401":
          description: Missing/invalid session, wrong current password, or a missing/wrong/replayed TOTP code on an enrolled account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                totpInvalidCode:
                  value: { error: totp_invalid_code }
                totpReplayed:
                  value: { error: totp_replayed }
                unauthorized:
                  value: { error: unauthorized }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The account has TOTP enabled but the server has no `FIELD_ENCRYPTION_KEY` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: totp_not_configured }

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Start a recovery-code-based password reset
      description: |
        Verifies the account-level recovery code and issues a short-lived
        (30 minute) opaque reset token. Errors are deliberately generic across
        unknown login, wrong recovery code, and pre-recovery-code accounts to
        keep the surface enumeration-safe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Unknown login, or a recovery code that does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRecoveryCredentials:
                  value: { error: invalid_recovery_credentials }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Complete a password reset
      description: |
        Consumes the reset token from `POST /auth/forgot-password`. On
        success: password and recovery code both rotate (the new recovery
        code is returned in plaintext), TOTP is disabled and its pending
        challenges are cleared, and every existing session for the account is
        revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset; recovery code rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResult"
        "400":
          description: New password fails the strength check (the reset token is not consumed and stays usable), or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                weak:
                  value: { error: weak_new_password }
        "401":
          description: Reset token missing, unknown, expired, or already consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidResetToken:
                  value: { error: invalid_reset_token }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/recovery-code/regenerate:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCode
      summary: Rotate the account recovery code
      description: |
        Requires the current password and, on a TOTP-enrolled account, a
        current TOTP `code` (a reset with the new recovery code clears TOTP,
        so the password alone must not rotate it). The code attempt counts
        toward the step-up TOTP budget. Pending password-reset tokens are
        deleted; existing sessions are left untouched.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRecoveryCodeRequest"
      responses:
        "200":
          description: New plaintext recovery code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Missing/invalid session, wrong current password, or a missing/wrong/replayed TOTP code on an enrolled account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                totpInvalidCode:
                  value: { error: totp_invalid_code }
                totpReplayed:
                  value: { error: totp_replayed }
                unauthorized:
                  value: { error: unauthorized }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The account has TOTP enabled but the server has no `FIELD_ENCRYPTION_KEY` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: totp_not_configured }

  /auth/totp/enroll:
    post:
      tags: [auth]
      operationId: totpEnroll
      summary: Begin TOTP 2FA enrollment
      description: |
        Requires the current password. Generates a fresh secret and stores it
        pending (`totp_enabled=false`) until confirmed by
        `POST /auth/totp/verify`. Fails with 503 `totp_not_configured` if the
        server has no `FIELD_ENCRYPTION_KEY` configured, and with
        409 `totp_already_enabled` if TOTP is already enabled.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPEnrollRequest"
      responses:
        "200":
          description: Pending secret issued for authenticator-app enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollmentStart"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Missing/invalid session, or wrong current password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                unauthorized:
                  value: { error: unauthorized }
        "409":
          description: TOTP is already enabled on this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyEnabled:
                  value: { error: totp_already_enabled }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Internal error, including a field-encryption failure while sealing the new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  value: { error: internal_error }
                secretFailed:
                  value: { error: totp_secret_failed }
        "503":
          description: Server has no FIELD_ENCRYPTION_KEY configured; TOTP is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  value: { error: totp_not_configured }

  /auth/totp/verify:
    post:
      tags: [auth]
      operationId: totpVerifyEnrollment
      summary: Confirm TOTP enrollment
      description: |
        Verifies a current code from the authenticator app against the
        pending secret from `POST /auth/totp/enroll`. On success, TOTP flips
        to enabled, the account recovery code is rotated (the previous code
        and any pending reset token stop working), and every other session
        for the account is revoked (the caller's own session stays valid).
        The client must show the returned `recovery_code` to the user: it is
        the only working recovery code from this point on.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPVerifyRequest"
      responses:
        "200":
          description: TOTP enabled; a new recovery code is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnabledResponse"
              examples:
                enabled:
                  value: { status: totp_enabled, recovery_code: 3f9c2a7e1b6d48c0a5e9f3b27d1c6e84 }
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Missing/invalid session, wrong/expired code, a replayed step, or a pending secret replaced by a newer `POST /auth/totp/enroll` (scan the new one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCode:
                  value: { error: totp_invalid_code }
                replayed:
                  value: { error: totp_replayed }
                unauthorized:
                  value: { error: unauthorized }
        "409":
          description: |
            TOTP is already enabled on this account; there is no pending secret
            to confirm (call `POST /auth/totp/enroll` first); or the pending
            secret's lifetime budget is spent (10 attempts per pending secret,
            no window restart) and this attempt discarded it
            (`totp_enrollment_discarded`: no wait makes it usable again, so
            restart with `POST /auth/totp/enroll`, which needs the password; a
            retry without restarting answers `totp_enrollment_not_started`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyEnabled:
                  value: { error: totp_already_enabled }
                enrollmentNotStarted:
                  value: { error: totp_enrollment_not_started }
                enrollmentDiscarded:
                  value: { error: totp_enrollment_discarded }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: |
            Request rate limit, or the enrollment TOTP budget is spent (5 code
            attempts per 15 minutes per client and per account); retry after
            `Retry-After`. A spent per-secret lifetime budget is 409
            `totp_enrollment_discarded`, not 429.
          headers:
            Retry-After:
              description: |
                Seconds until the caller may retry: the seconds left in the spent
                `AUTH_RATE_LIMIT_WINDOW` (at most 900 by default) on a request rate-limit
                refusal, 1 to 900 (the end of the spent window) on a spent
                enrollment budget.
              schema:
                type: string
                example: "60"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  value: { error: rate_limited }
        "500":
          description: Internal error, including a field-decryption failure while opening the pending secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  value: { error: internal_error }
                secretFailed:
                  value: { error: totp_secret_failed }
        "503":
          description: Server has no FIELD_ENCRYPTION_KEY configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  value: { error: totp_not_configured }

  /auth/totp/disable:
    post:
      tags: [auth]
      operationId: totpDisable
      summary: Turn off TOTP 2FA
      description: |
        Requires both the current password AND a current TOTP code, so a
        temporarily-borrowed authenticator alone cannot remove 2FA. On
        success, the secret is cleared, and every session and pending
        challenge for the account is revoked/deleted. Code attempts here
        draw the step-up TOTP budget (429 `rate_limited` once spent), not the
        sign-in budget of `/auth/totp/challenge`.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "200":
          description: TOTP disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                disabled:
                  value: { status: totp_disabled }
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Missing/invalid session, wrong current password, wrong/expired code, or a replayed step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                invalidCode:
                  value: { error: totp_invalid_code }
                replayed:
                  value: { error: totp_replayed }
                unauthorized:
                  value: { error: unauthorized }
        "409":
          description: TOTP is not enabled on this account, including when a concurrent disable already turned it off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notEnabled:
                  value: { error: totp_not_enabled }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Internal error, including a field-decryption failure while opening the stored secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  value: { error: internal_error }
                secretFailed:
                  value: { error: totp_secret_failed }
        "503":
          description: Server has no FIELD_ENCRYPTION_KEY configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  value: { error: totp_not_configured }

  /auth/totp/challenge:
    post:
      tags: [auth]
      operationId: totpChallenge
      summary: Complete the TOTP second factor after login
      description: |
        Consumes the `totp_challenge.challenge_id` returned by
        `POST /auth/login` plus a current authenticator code, and issues a
        session on success; past `MAX_SESSIONS_PER_ACCOUNT` that mint revokes
        the account's oldest session, as on `POST /auth/login`. Each challenge allows a bounded number of failed
        code attempts before it is burnt and the caller must restart from
        password login. Code attempts also draw the sign-in TOTP budget
        across all challenges: 5 per 15-minute window per client address and
        per account, refused when either is spent. Past the cap this route
        answers 429 `rate_limited` with `Retry-After` set to the end of the
        window, and logging in again does not reset it. A success clears only
        the caller's client bucket. The sign-in budget is separate from the
        step-up budget the session-authenticated TOTP routes draw (5 per
        15 minutes per client and per account, cleared by a success), so a
        spent sign-in budget does not block the owner's session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPChallengeRequest"
      responses:
        "200":
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Unknown/expired/burnt challenge, or a wrong/replayed code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                challengeInvalid:
                  value: { error: totp_challenge_invalid }
                invalidCode:
                  value: { error: totp_invalid_code }
                replayed:
                  value: { error: totp_replayed }
                unauthorized:
                  value: { error: unauthorized }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Internal error, including a field-decryption failure while opening the stored secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalError:
                  value: { error: internal_error }
                secretFailed:
                  value: { error: totp_secret_failed }
        "503":
          description: Server has no FIELD_ENCRYPTION_KEY configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notConfigured:
                  value: { error: totp_not_configured }

  /auth/session:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: Get the current session's account view
      description: Minimal account-scoped state for the authenticated caller, including live TOTP status.
      security:
        - sessionBearerAuth: []
      responses:
        "200":
          description: Current account view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessionView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: Revokes the session identified by the bearer token on this request. No request body.
      security:
        - sessionBearerAuth: []
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                revoked:
                  value: { status: revoked }
        "401":
          description: Missing bearer token, or it does not match any session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /account:
    delete:
      tags: [auth]
      operationId: deleteAccount
      summary: Permanently erase the account
      description: |
        Erases every row this server holds for the caller's own account in a
        single transaction: the account row, sessions, devices, the encrypted
        sync blob, the wrapped recovery-key package, pending password-reset
        tokens, and pending TOTP challenges. The account is derived only from
        the authenticated session — there is no field to name a different
        account. Requires the current password and, on a TOTP-enrolled
        account, a current TOTP `code` (single-use, counted toward the
        step-up TOTP budget; a missing code is not counted), so a stolen
        session alone cannot erase the account. A managed account has no password, so a
        managed session is refused with `403 managed_account_delete_via_bridge`;
        it is erased only through `DELETE /managed/accounts/{account_id}`.
        Not idempotent for the same bearer token: the account's sessions are
        deleted with it, so a retry after a successful delete answers
        `401 unauthorized`; a client that sees that after sending the delete
        should treat the account as gone.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeleteRequest"
      responses:
        "200":
          description: Account and all owned data erased. A retry with the same token answers 401, not 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                deleted:
                  value: { status: account_deleted }
        "400":
          description: The body is not acceptable JSON — missing, malformed, an unknown field, trailing data or over 4 KiB (see `InvalidJSON`). Not reached by a managed session, which gets 403 first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
        "401":
          description: Missing/invalid session, wrong current password, or a missing/wrong/replayed TOTP code on an enrolled account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                totpInvalidCode:
                  value: { error: totp_invalid_code }
                totpReplayed:
                  value: { error: totp_replayed }
        "403":
          description: The session belongs to a managed account, which is erased only through the managed-bridge purge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                managedAccountDeleteViaBridge:
                  value: { error: managed_account_delete_via_bridge }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The account has TOTP enabled but the server has no `FIELD_ENCRYPTION_KEY` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: totp_not_configured }

  /managed/session:
    post:
      tags: [managed-bridge]
      operationId: createManagedSession
      summary: Provision a managed-mode sync session
      description: |
        Machine-to-machine only: intended for a separate trusted managed-auth
        service, never a direct client. Requires the
        `MANAGED_BRIDGE_TOKEN` bearer credential; the route itself is disabled
        (503) whenever that token is not configured on this server. Provisions
        or reuses a `mode=managed` account for the given opaque
        `account_id` and returns a session for it, without any login/password
        exchange. Each mint counts toward `MAX_SESSIONS_PER_ACCOUNT`; past it
        the account's oldest sync session is revoked. A mint never reverses an entitlement lapse: a lapsed
        account answers 409 until a reactivation signal
        (`POST /managed/accounts/{account_id}/premium` with `active: true`)
        clears the lapse or the account is erased; the next mint then
        restores `premium_active` (after an erase it creates a new, empty
        account). A lapse is stored on the account row, so one sent while
        the account does not exist here is not remembered: the caller must
        re-send the account's entitlement state after a mint that may have
        created it. This server cannot enforce that re-send.
      security:
        - managedBridgeAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedSessionRequest"
      responses:
        "200":
          description: Managed session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: account_id fails the managed-account id pattern, names an existing non-managed account, or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                invalidManagedAccount:
                  value: { error: invalid_managed_account }
        "409":
          description: The account's entitlement lapse is recorded; no session is issued and premium stays off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                managedAccountLapsed:
                  value: { error: managed_account_lapsed }
        "401":
          description: Missing/invalid MANAGED_BRIDGE_TOKEN bearer credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: MANAGED_BRIDGE_TOKEN is not configured on this server; the bridge is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bridgeDisabled:
                  value: { error: managed_bridge_disabled }

  /managed/accounts/{account_id}:
    delete:
      tags: [managed-bridge]
      operationId: purgeManagedAccount
      summary: Permanently erase a managed account's sync-plane data
      description: |
        Machine-to-machine only: called by the separate trusted managed-auth
        service when a managed-cloud user deletes their account, so every row
        this server holds for that account — the account row, sessions,
        devices, the encrypted sync blob, the wrapped recovery-key package,
        pending password-reset tokens, and TOTP challenges — is erased in a
        single transaction and nothing is orphaned on the sync plane. Requires
        the same `MANAGED_BRIDGE_TOKEN` bearer credential as
        `POST /managed/session`; the route is disabled (503) whenever that
        token is not configured on this server.

        Only `mode=managed` accounts are erasable through this path: a
        self-hosted account whose id matches is left untouched and gets the
        same 200 an id nobody holds gets, so the answer never reveals that a
        self-hosted account exists. Idempotent: an account that never existed
        or is already gone still reports success, so the managed caller can
        safely retry after a dropped response.
      security:
        - managedBridgeAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: Opaque managed-account identifier; trimmed of ASCII whitespace only, it must match `^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$` (ASCII only — a non-ASCII id answers 400 `invalid_managed_account` even where lowercasing would fold it into ASCII), then is lowercased server-side, the same shape as the `POST /managed/session` account_id.
          schema:
            type: string
      responses:
        "200":
          description: Managed account and every row referencing it erased (or already gone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                purged:
                  value: { status: account_purged }
        "400":
          description: account_id fails the managed-account id pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidManagedAccount:
                  value: { error: invalid_managed_account }
        "401":
          description: Missing/invalid MANAGED_BRIDGE_TOKEN bearer credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: MANAGED_BRIDGE_TOKEN is not configured on this server; the bridge is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bridgeDisabled:
                  value: { error: managed_bridge_disabled }

  /managed/accounts/{account_id}/premium:
    post:
      tags: [managed-bridge]
      operationId: setManagedAccountPremiumLapse
      summary: Record or retract a managed account's entitlement-lapse signal
      description: |
        Machine-to-machine only: called by the separate trusted managed-auth
        service when a managed-cloud account's subscription lapses (or a
        previously reported lapse turns out to be a false positive).
        Requires the same `MANAGED_BRIDGE_TOKEN` bearer credential as
        `POST /managed/session` and the account-purge endpoint; the route is
        disabled (503) whenever that token is not configured on this server.
        A lifecycle signal only — the request and response never carry
        anything beyond the account id, the boolean flag and its `as_of`
        timestamp. This server stores the state the managed service reports;
        it never decides entitlement itself.

        `active: false` records the lapse (`lapsed_at`), clears
        `premium_active`, and immediately revokes every still-valid session
        the account holds — no entitlement, no sync, from that moment on.
        The account's encrypted data (blobs, recovery-key package, devices)
        is left alone; it is erased only once `lapsed_at` is older than the
        server's configured `LAPSED_ACCOUNT_GRACE_PERIOD` (default 60 days),
        by the separate `purge-lapsed-accounts` operator subcommand.

        `active: true` is the only way back from a lapse: it clears the
        marker WITHOUT touching `premium_active` or any session, and the next
        `POST /managed/session` restores premium and issues the session. A
        mint alone never clears a lapse.

        Signals are ordered by `as_of`, the managed service's observation
        instant (RFC 3339). It is required for both values of `active`; a
        signal without it is refused with 400 `invalid_entitlement_signal`.
        A reactivation is applied only when its `as_of` is strictly newer
        than the last applied signal; a lapse is applied unless its `as_of`
        is strictly older (ties go to the lapse). A refused signal answers 409
        and changes nothing, so a delayed or retried reactivation can never
        undo a newer lapse. An `as_of` more than 5 minutes ahead of this
        server's clock is refused with 400.

        Idempotent: replaying an identical lapse is a no-op that still
        reports success and never pushes the recorded `lapsed_at` forward,
        so a duplicated or retried signal can never extend the retention
        window past the configured grace period.

        Only `mode=managed` accounts can be affected: a self-hosted account
        whose id matches is left untouched and gets the same 200 an unknown
        id gets, so the answer never reveals that one exists. An account this server has never heard of, or one that is
        gone by the time the write runs, is a benign no-op success in either
        direction — the managed caller does not need to know whether this
        server has ever seen the account. Such a no-op records nothing: a
        lapse sent while the account does not exist here (before its first
        `POST /managed/session`, or after it was erased) is not remembered,
        and the next mint creates the account unlapsed. The success answer
        does not say whether the signal was recorded, so the caller must
        re-send the account's current entitlement state after a mint that
        may have created the account; this server cannot enforce that.
      security:
        - managedBridgeAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: Opaque managed-account identifier; trimmed of ASCII whitespace only, it must match `^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$` (ASCII only — a non-ASCII id answers 400 `invalid_managed_account` even where lowercasing would fold it into ASCII), then is lowercased server-side, the same shape as the `POST /managed/session` account_id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccountPremiumRequest"
      responses:
        "200":
          description: Lapse signal processed (recorded, retracted, already in that state, or the account does not exist here and nothing was stored). `lapse_recorded` is also the answer for an absent account, where it is a no-op that stores nothing — the status does not prove a lapse was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                lapseRecorded:
                  summary: active=false (also answered, as a no-op, for an account this server does not hold)
                  value: { status: lapse_recorded }
                lapseCleared:
                  summary: active=true
                  value: { status: lapse_cleared }
        "400":
          description: "account_id fails the managed-account id pattern (`invalid_managed_account`); the signal is invalid (`invalid_entitlement_signal`: `active` missing or null, `as_of` missing, or an `as_of` before the Unix epoch or more than 5 minutes ahead of this server's clock); or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`) — an `as_of` that is not RFC 3339 is `invalid_json`, not `invalid_entitlement_signal`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                invalidManagedAccount:
                  value: { error: invalid_managed_account }
                invalidEntitlementSignal:
                  value: { error: invalid_entitlement_signal }
        "401":
          description: Missing/invalid MANAGED_BRIDGE_TOKEN bearer credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "409":
          description: A newer lapse or reactivation has already been applied; this signal changed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                staleEntitlementSignal:
                  value: { error: stale_entitlement_signal }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: MANAGED_BRIDGE_TOKEN is not configured on this server; the bridge is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bridgeDisabled:
                  value: { error: managed_bridge_disabled }

  /managed/accounts/{account_id}/sessions/revoke:
    post:
      tags: [managed-bridge]
      operationId: revokeManagedAccountSessions
      summary: Revoke every sync session of a managed account
      description: |
        Machine-to-machine only: called by the separate trusted managed-auth
        service when a managed account's credentials change (password or
        second-factor change) or an operator revokes its sessions, so a sync
        session minted earlier stops authenticating at once instead of living
        out its `SESSION_TTL`. It revokes every session of the account, on
        every device, so it is not a single-device logout. A session minted
        by a `POST /managed/session` that commits after this call is not
        revoked: ordering a mint against a revoke is the caller's side.
        Requires the same `MANAGED_BRIDGE_TOKEN` bearer
        credential as `POST /managed/session`; the route is disabled (503)
        whenever that token is not configured on this server.

        Deletes sessions only: the account row, its devices, the encrypted
        sync blob, the wrapped recovery-key package and the lapse state
        (`premium_active`, the recorded lapse and its as-of) are left as they
        are, and the next `POST /managed/session` issues a fresh session. The
        delete is scoped to `mode=managed` accounts. An account that does not
        exist, a managed account with no sessions, and a self-hosted account
        whose id matches all answer the same `200 {"status":"sessions_revoked"}`
        and change nothing, so the answer never reveals whether a self-hosted
        account exists and the call is safe to repeat; retrying after a
        dropped response is the managed caller's side.

        Takes no request body. A request that sends one must declare
        `Content-Type: application/json` (415 otherwise, as on every route);
        the body is ignored.
      security:
        - managedBridgeAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: Opaque managed-account identifier; trimmed of ASCII whitespace only, it must match `^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$` (ASCII only — a non-ASCII id answers 400 `invalid_managed_account` even where lowercasing would fold it into ASCII), then is lowercased server-side, the same shape as the `POST /managed/session` account_id.
          schema:
            type: string
      responses:
        "200":
          description: Every session of the managed account deleted — or none existed, or the id names no managed account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                revoked:
                  value: { status: sessions_revoked }
        "400":
          description: account_id fails the managed-account id pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidManagedAccount:
                  value: { error: invalid_managed_account }
        "401":
          description: Missing/invalid MANAGED_BRIDGE_TOKEN bearer credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: MANAGED_BRIDGE_TOKEN is not configured on this server; the bridge is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bridgeDisabled:
                  value: { error: managed_bridge_disabled }

  /managed/accounts/{account_id}/recovery-key:
    put:
      tags: [managed-bridge]
      operationId: replaceManagedAccountRecoveryKey
      summary: Replace a managed account's wrapped recovery-key package
      description: |
        Machine-to-machine only: called by the separate trusted managed-auth
        service after its own re-authentication of the account's owner, to
        re-key the owner's recovery path. A managed account has no password,
        so its session may store only a first package (`PUT /sync/recovery-key`
        refuses a differing one with `403 managed_recovery_key_overwrite`);
        this route is the only way to replace it. Requires the same
        `MANAGED_BRIDGE_TOKEN` bearer credential as `POST /managed/session`;
        the route is disabled (503) whenever that token is not configured on
        this server.

        The package passes the same format validation as
        `PUT /sync/recovery-key` and replaces any stored package, or stores a
        first one. Sessions, devices, the encrypted sync blob and the lapse
        state are left as they are; revoking sessions after a re-key is the
        caller's side (`POST /managed/accounts/{account_id}/sessions/revoke`).
        A repeat with the same package writes nothing (`updated_at` is
        unchanged) and answers the same 200. A lapsed managed account is
        written like any other; its purge clock is unaffected. Only `mode=managed` accounts
        are written: an account that does not exist and a self-hosted account
        whose id matches both answer the same
        `404 managed_account_not_found` and nothing is written, so the answer
        never tells them apart.

        Optional `expected_phrase_fingerprint_hex` makes the replace a
        compare-and-swap: it commits only while the stored package's
        `phrase_fingerprint_hex` equals it, checked by the writing statement
        itself; another fingerprint, or no stored package, answers
        `409 recovery_key_conflict` and writes nothing, so a re-sent older
        rotation cannot bring a retired phrase back. A body equal to the
        stored package is still the no-op 200 whatever the expectation, so a
        retry of a re-key that committed succeeds. Without the field (or with
        null) the replace stays unconditional. The account check runs before
        the fingerprint comparison, so an unknown id with a valid body still
        answers 404, never 409.
      security:
        - managedBridgeAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: Opaque managed-account identifier; trimmed of ASCII whitespace only, it must match `^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$` (ASCII only — a non-ASCII id answers 400 `invalid_managed_account` even where lowercasing would fold it into ASCII), then is lowercased server-side, the same shape as the `POST /managed/session` account_id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedRecoveryKeyPackageRequest"
      responses:
        "200":
          description: The package is stored for the managed account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                replaced:
                  value: { status: recovery_key_replaced }
        "400":
          description: account_id fails the managed-account id pattern, the body is not acceptable JSON (malformed, an unknown field, trailing data or over 8 KiB; `invalid_json`, see `InvalidJSON`), or the package or `expected_phrase_fingerprint_hex` fails validation (`invalid_recovery_package`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidManagedAccount:
                  value: { error: invalid_managed_account }
                invalidRecoveryPackage:
                  value: { error: invalid_recovery_package }
                invalidJSON:
                  value: { error: invalid_json }
        "401":
          description: Missing/invalid MANAGED_BRIDGE_TOKEN bearer credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
        "404":
          description: The id names no managed account here (none at all, or a self-hosted one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value: { error: managed_account_not_found }
        "409":
          description: '`expected_phrase_fingerprint_hex` was sent, the stored package carries another fingerprint (or no package is stored), and the body is not the stored package. Nothing is written.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                recoveryKeyConflict:
                  value: { error: recovery_key_conflict }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: MANAGED_BRIDGE_TOKEN is not configured on this server; the bridge is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bridgeDisabled:
                  value: { error: managed_bridge_disabled }

  /sync/capabilities:
    get:
      tags: [sync]
      operationId: getCapabilities
      summary: Get this account's sync capability document
      description: Reflects self-hosted vs. managed mode, premium/recovery/push/portal/insight support flags, and the configured device and blob-size ceilings.
      security:
        - sessionBearerAuth: []
      responses:
        "200":
          description: Capability document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /sync/devices:
    post:
      tags: [sync]
      operationId: attachDevice
      summary: Register or refresh a device for this account
      description: Upserts a device row scoped to the caller's account and binds the calling session to it if the session is not bound yet. One device per session — a session already bound to a different device is refused with `409 session_device_bound` and nothing is attached; re-attaching its own device refreshes it. Rejected once the account is at its configured device ceiling and the device is not already known.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "200":
          description: Device attached/refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: device_id shorter than 8 bytes or longer than 128, device_label shorter than 2 bytes or longer than 64 (after trimming) (`invalid_device`), or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                invalidDevice:
                  value: { error: invalid_device }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SyncDisabled"
        "409":
          description: "`session_device_bound` — the calling session is already bound to a different device (log in again to attach another one); checked first. `too_many_devices` — the account is already at its configured device ceiling and this device is not already registered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sessionDeviceBound:
                  value: { error: session_device_bound }
                tooManyDevices:
                  value: { error: too_many_devices }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [sync]
      operationId: listDevices
      summary: List the account's devices
      description: Returns every device attached to the caller's account, account-scoped so one account can never see another's devices.
      security:
        - sessionBearerAuth: []
      responses:
        "200":
          description: The account's devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SyncDisabled"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /sync/devices/{device_id}:
    delete:
      tags: [sync]
      operationId: removeDevice
      summary: Remove one of the account's devices
      description: |
        Detaches a device from the caller's account, freeing a slot. The delete is scoped to the authenticated account in the query, so a caller can only ever remove its own devices. Every session bound to the device is revoked in the same transaction — removing the caller's own device ends the calling session too. Sessions never bound (no `POST /sync/devices` yet) are unaffected.

        On a TOTP-enrolled account removal is a step-up: the body must carry the current password and a current TOTP `code` (password checked first; the code is single-use and counted toward the step-up TOTP budget, a missing code is not), so a stolen session alone can neither evict the owner's devices nor spend the step-up TOTP budget. On an enrolled account wrong passwords draw on the shared step-up bucket (429 once it is spent). An account without TOTP may omit the body and never touches that bucket.
      security:
        - sessionBearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: The device_id to remove.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRemoveRequest"
      responses:
        "200":
          description: Device removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                removed:
                  value: { status: removed }
        "400":
          description: Empty device_id, or a body that is not acceptable JSON (`invalid_json`, see `InvalidJSON`; an empty body is accepted here and means no step-up fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidDevice:
                  value: { error: invalid_device }
                invalidJSON:
                  value: { error: invalid_json }
        "401":
          description: Missing/invalid session, wrong current password, or a missing/wrong/replayed TOTP code on an enrolled account. `invalid_current_password` also answers a removal whose checks went stale while it was processed (the caller's own session enrolled TOTP or changed the password meanwhile), even when no password was sent; a retry asks for the step-up the account now needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                totpInvalidCode:
                  value: { error: totp_invalid_code }
                totpReplayed:
                  value: { error: totp_replayed }
        "403":
          $ref: "#/components/responses/SyncDisabled"
        "404":
          description: The account has no device with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value: { error: device_not_found }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The account has TOTP enabled but the server has no `FIELD_ENCRYPTION_KEY` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: totp_not_configured }

  /sync/recovery-key:
    get:
      tags: [sync]
      operationId: getRecoveryKeyPackage
      summary: Get the wrapped recovery-key package
      description: |
        Returns the account's client-wrapped master-key package as opaque
        hex fields plus metadata. The server never sees the recovery phrase
        or the unwrapped key.
      security:
        - sessionBearerAuth: []
      responses:
        "200":
          description: Recovery-key package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryKeyPackageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SyncDisabled"
        "404":
          description: No recovery-key package has been stored for this account yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value: { error: recovery_package_not_found }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [sync]
      operationId: putRecoveryKeyPackage
      summary: Store/replace the wrapped recovery-key package
      description: |
        Upserts the account's client-wrapped master-key package. All fields
        are opaque to the server beyond format validation (fixed algorithm/KDF
        identifiers, fixed word count, hex length checks) — the server never
        derives or sees the unwrapped key. Requires the current password and,
        on a TOTP-enrolled account, a current TOTP `code` (single-use, counted
        toward the step-up TOTP budget; a missing code is not counted), so
        a stolen session alone cannot overwrite the owner's recovery path.
        A managed account has no password: its session may store a first
        package, but a valid package that differs from a stored one is refused with
        `403 managed_recovery_key_overwrite` and nothing is written. No
        session route replaces a managed account's package: the managed
        service re-keys it through
        `PUT /managed/accounts/{account_id}/recovery-key` after its own
        re-authentication, and the bridge purge clears it with the rest of
        the account.

        A package equal to the stored one (after the same trim + lowercase
        normalization, same `mnemonic_word_count`) is a no-op: it needs no
        `current_password` or `code`, writes nothing (`updated_at` is
        unchanged), is not refused by a spent wrong-password bucket, and
        returns the stored package with 200.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryKeyPackageRequest"
      responses:
        "200":
          description: Recovery-key package stored, or the identical stored package returned unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryKeyPackageResponse"
        "400":
          description: Package fails format validation (algorithm, KDF, mnemonic word count, or hex field length/format; `invalid_recovery_package`), or the body is not acceptable JSON (`invalid_json`, see `InvalidJSON`; the cap here is 8 KiB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                invalidPackage:
                  value: { error: invalid_recovery_package }
        "401":
          description: Missing/invalid session, wrong current password, or a missing/wrong/replayed TOTP code on an enrolled account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value: { error: unauthorized }
                invalidCurrentPassword:
                  value: { error: invalid_current_password }
                totpInvalidCode:
                  value: { error: totp_invalid_code }
                totpReplayed:
                  value: { error: totp_replayed }
        "403":
          description: The account reports `sync_enabled=false`, or a managed session sent a package that differs from the stored one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                syncDisabled:
                  value: { error: sync_disabled }
                managedRecoveryKeyOverwrite:
                  value: { error: managed_recovery_key_overwrite }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The account has TOTP enabled but the server has no `FIELD_ENCRYPTION_KEY` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example: { error: totp_not_configured }

  /sync/blob:
    get:
      tags: [sync]
      operationId: getBlob
      summary: Get the account's encrypted sync blob
      description: |
        Returns the single ciphertext blob for this account as opaque
        base64, plus schema/generation/checksum metadata. The server never
        decrypts or inspects the contents.
      security:
        - sessionBearerAuth: []
      responses:
        "200":
          description: Encrypted blob.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SyncDisabled"
        "404":
          description: No blob has been stored for this account yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value: { error: blob_not_found }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/BlobTransferBusy"
    put:
      tags: [sync]
      operationId: putBlob
      summary: Store the account's encrypted sync blob
      description: |
        Replaces the account's single ciphertext blob under an
        optimistic-concurrency generation counter. `ciphertext_base64` is
        opaque to the server beyond a SHA-256 checksum match and a
        configured max-size ceiling; the server never decrypts it.
        `generation` must be strictly greater than the currently stored
        generation (a fresh account may write any positive generation).
        Optional `expected_generation` adds a precondition: the write
        commits only while the stored generation still equals it, so a
        device writing from a stale baseline gets 409 instead of silently
        replacing another device's newer write. Omitted (or null), the
        write behaves as before.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobPutRequest"
      responses:
        "200":
          description: Blob stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobResponse"
        "400":
          description: |
            `invalid_blob`: non-positive schema_version/generation/expected_generation, a generation more than 15 minutes ahead of server time, empty ciphertext, ciphertext over `MAX_BLOB_BYTES`, malformed checksum_sha256, or a checksum that does not match the ciphertext. `invalid_ciphertext`: ciphertext_base64 is not valid base64. `invalid_json`: the body is not acceptable JSON (see `InvalidJSON`); an oversize request body (over base64(`MAX_BLOB_BYTES`) plus 8 KiB) answers `invalid_json`, while a body inside that cap whose decoded ciphertext is over `MAX_BLOB_BYTES` answers `invalid_blob`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidJSON:
                  value: { error: invalid_json }
                invalidBlob:
                  value: { error: invalid_blob }
                invalidCiphertext:
                  value: { error: invalid_ciphertext }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SyncDisabled"
        "409":
          description: generation is not strictly greater than the currently stored generation (a concurrent writer already advanced it), or `expected_generation` was sent and does not equal the stored generation (or no blob is stored). Nothing is written. A stored generation more than 15 minutes ahead of server time never counts as newer; only an `expected_generation` mismatch can still refuse a write over it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                staleGeneration:
                  value: { error: stale_generation }
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/BlobTransferBusy"

  /sync/rekey:
    put:
      tags: [sync]
      operationId: rekeySync
      summary: Store a recovery-key package and the blob sealed under it, atomically
      description: |
        Writes the wrapped recovery-key package and the ciphertext blob in one
        transaction: both land or neither does, so a refused blob write never
        leaves a package the stored blob is not sealed under. Used for first
        setup and for a re-key; servers that offer it report
        `atomic_rekey: true` in `GET /sync/capabilities`, and clients fall
        back to `PUT /sync/recovery-key` then `PUT /sync/blob` without it.

        The package follows `PUT /sync/recovery-key`: one equal to the stored
        package (after normalization) needs no step-up and draws on no
        step-up bucket; a differing one needs `current_password` (checked
        before the package and blob contents are validated) and, on a TOTP-enrolled account, a
        current `code` (checked after both bodies are validated). A managed
        account may store a first package only. The blob follows
        `PUT /sync/blob`, except that `expected_generation` is required:
        `0` means no blob is stored yet, a positive value must equal the
        stored generation.
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RekeyRequest"
      responses:
        "200":
          description: Package and blob stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RekeyResponse"
        "400":
          description: |
            `invalid_recovery_package`: the package fails `PUT /sync/recovery-key`'s validation. `invalid_blob`: the blob fails `PUT /sync/blob`'s validation, or `expected_generation` is absent or negative. `invalid_ciphertext`: ciphertext_base64 is not valid base64. `invalid_json`: the body is not acceptable JSON or is over base64(`MAX_BLOB_BYTES`) plus 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            `invalid_current_password` (wrong or missing password for a differing package, or a password/TOTP change during the check), `totp_invalid_code` / `totp_replayed` (enrolled account), or `unauthorized` (no live session). Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`managed_recovery_key_overwrite`: a managed account's session tried to replace its stored package. `sync_disabled`: see `SyncDisabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`stale_generation`: `expected_generation` does not match the stored blob (or `0` while one is stored), or the generation does not advance. On a TOTP-enrolled account this is answered before the code is checked, so the code stays usable. `recovery_key_conflict`: the package sent as unchanged was replaced before the write. Nothing is written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`totp_not_configured`: the account has TOTP enrolled, the package differs, and the server has no `FIELD_ENCRYPTION_KEY` (fails closed). `blob_transfer_busy`: every blob transfer slot stayed busy for the bounded wait, or another blob transfer of the account is still in progress; retry after `Retry-After` seconds (see the `BlobTransferBusy` response)."
          headers:
            Retry-After:
              description: Sent with `blob_transfer_busy` only, as on the `BlobTransferBusy` response.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                totpNotConfigured:
                  value: { error: totp_not_configured }
                blobTransferBusy:
                  value: { error: blob_transfer_busy }

components:
  securitySchemes:
    sessionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
      description: |
        Opaque session token issued by /auth/register, /auth/login,
        /auth/totp/challenge, or /managed/session, sent as
        `Authorization: Bearer <session_token>`. Validated by
        AuthService.Authenticate against the hash stored for the session; an
        expired or unknown token returns 401 `unauthorized`.
    managedBridgeAuth:
      type: http
      scheme: bearer
      bearerFormat: MANAGED_BRIDGE_TOKEN
      description: |
        Static bridge credential configured via the MANAGED_BRIDGE_TOKEN
        environment variable, sent as `Authorization: Bearer <token>`.
        Reserved for the separate trusted managed-auth service; the route is
        503 `managed_bridge_disabled` whenever this variable is unset.
    metricsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: METRICS_BEARER_TOKEN
      description: |
        Static credential configured via METRICS_BEARER_TOKEN, required
        whenever METRICS_ENABLED=true (startup refuses the combination
        without it).

  responses:
    Unauthorized:
      description: Missing/invalid/expired bearer session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value: { error: unauthorized }
    SyncDisabled:
      description: The session's account reports `sync_enabled=false` (a managed account without premium); device, recovery-key and blob routes are refused. `GET /sync/capabilities` still answers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            syncDisabled:
              value: { error: sync_disabled }
    BlobTransferBusy:
      description: |
        Every blob transfer slot stayed busy for the whole bounded wait (at most a
        quarter of the shorter HTTP read/write timeout, never over 2 seconds),
        or, answered at once, another `GET` / `PUT /sync/blob` or
        `PUT /sync/rekey` of the same account is still in progress or waiting:
        an account holds at most one slot.
        No body was parsed and nothing was written. The refusal counts against
        the per-account sync rate limit, which GET, PUT and every device of the
        account share; `Retry-After` paces retries at that limit's average rate.
        Browser clients on an allowed origin can read `Retry-After`: it is
        listed in `Access-Control-Expose-Headers`.
      headers:
        Retry-After:
          description: Seconds until the caller may retry, SYNC_RATE_LIMIT_WINDOW / SYNC_RATE_LIMIT_COUNT rounded up and at least 2 (6 at the defaults).
          schema:
            type: string
            example: "6"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            blobTransferBusy:
              value: { error: blob_transfer_busy }
    RateLimited:
      description: |
        Per-route auth rate limit exceeded (per-IP, per-account, and/or
        per-login-identifier depending on the route), or a TOTP attempt budget
        spent. The `Retry-After` value depends on the limiter: the seconds left in
        the spent request-limit window — `AUTH_RATE_LIMIT_WINDOW` (at most 900 by
        default) on the credential routes, `SYNC_RATE_LIMIT_WINDOW` (at most 60 by
        default) on the `/sync/devices`, `/sync/recovery-key`, `/sync/blob` and
        read-state routes — and 1 to 900 seconds
        (the end of the spent budget's fixed 15-minute window) on a TOTP-budget
        refusal. Browser clients on an allowed origin can read `Retry-After`:
        it is listed in `Access-Control-Expose-Headers`.
      headers:
        Retry-After:
          description: Seconds until the caller may retry (the rest of the request-limit window, at most 900 by default on the credential routes, 60 on the sync and read-state routes; 1 to 900 on a TOTP-budget refusal; see the response description).
          schema:
            type: string
            example: "60"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimited:
              value: { error: rate_limited }
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalError:
              value: { error: internal_error }
    InvalidJSON:
      description: "The request body is not acceptable JSON: malformed, an unknown field, an empty body, data after the first JSON value, or larger than the route's cap (4 KiB; 8 KiB on the recovery-key routes; base64(`MAX_BLOB_BYTES`) plus 8 KiB on `PUT /sync/blob`). A field of the wrong type, including a non-RFC 3339 `as_of`, is `invalid_json` too."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidJSON:
              value: { error: invalid_json }
    UnsupportedMediaType:
      description: "The request carries a body that is not declared `Content-Type: application/json` (parameters such as `charset` are allowed). Checked before any rate limiter, so the refused request spends no bucket. A request without a body needs no content type."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unsupportedMediaType:
              value: { error: unsupported_media_type }
    OriginNotAllowed:
      description: The request carries an `Origin` header that is not in `ALLOWED_ORIGINS`, or carries none and its `Sec-Fetch-Site` is `cross-site` or `same-site` (not on `/healthz`, `/readyz`, `/metrics`). Answered on every route and method before any rate limiter, so the refused request spends no bucket; no CORS headers are set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            originNotAllowed:
              value: { error: origin_not_allowed }
    HostNotAllowed:
      description: The server has `ALLOWED_HOSTS` set and the request's `Host` (port ignored, ASCII case-insensitive, one trailing dot dropped) is not in it, is not an IP literal and is not `localhost`. Answered on every route and method ahead of the origin check and every rate limiter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            hostNotAllowed:
              value: { error: host_not_allowed }

  schemas:
    ErrorResponse:
      type: object
      description: Shared error envelope returned by every non-2xx JSON response in this API.
      properties:
        error:
          type: string
          description: Stable machine-readable error key (e.g. `invalid_credentials`, `rate_limited`). See each operation for the keys it can return.
      required: [error]
      additionalProperties: false

    StatusResponse:
      type: object
      description: Generic single-field status acknowledgement used by several endpoints.
      properties:
        status:
          type: string
          description: 'Short status key, e.g. "ok", "totp_disabled", "revoked", "account_deleted", "account_purged", "recovery_key_replaced".'
      required: [status]
      additionalProperties: false

    CredentialsRequest:
      type: object
      description: Shared login+password request body for register and login.
      properties:
        login:
          type: string
          maxLength: 254
          description: Counted in bytes (UTF-8), not characters; `maxLength` is kept as a hint and understates multi-byte input. Normalized (lowercased, trimmed) server-side; on registration it must be 3 to 254 bytes after normalizing (longer → 400 `invalid_registration_input`), and the `managed:` prefix is reserved and rejected. Login does not re-check the length, so an account registered before the cap keeps working.
        password:
          type: string
          format: password
          description: On registration, minimum 12 characters (after trimming) and at most 72 UTF-8 bytes (bcrypt's input ceiling); hashed with bcrypt.
      required: [login, password]
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          description: Must differ from current_password and satisfy the same length policy as registration.
        code:
          type: string
          description: Current 6-digit TOTP code. Required when the account has TOTP enabled; ignored otherwise.
      required: [current_password, new_password]
      additionalProperties: false

    PasswordChangedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [password_changed]
        recovery_code:
          type: string
          description: New plaintext recovery code replacing the previous one. Shown once; store it out of band.
      required: [status, recovery_code]
      additionalProperties: false

    ForgotPasswordRequest:
      type: object
      properties:
        login:
          type: string
        recovery_code:
          type: string
          description: The plaintext account-level recovery code issued at registration or by the most recent rotation.
      required: [login, recovery_code]
      additionalProperties: false

    ResetPasswordRequest:
      type: object
      properties:
        reset_token:
          type: string
          description: Plaintext token returned by POST /auth/forgot-password. Single-use; expires after 30 minutes.
        new_password:
          type: string
          format: password
      required: [reset_token, new_password]
      additionalProperties: false

    AccountDeleteRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
          description: Required for self-hosted accounts. A managed session is refused with 403 before the body is read.
        code:
          type: string
          description: Current 6-digit TOTP code. Required when the account has TOTP enabled; ignored otherwise.
      additionalProperties: false

    DeviceRemoveRequest:
      type: object
      description: Needed only when the account has TOTP enabled; otherwise the body may be omitted.
      properties:
        current_password:
          type: string
          format: password
        code:
          type: string
          description: Current 6-digit TOTP code.
      additionalProperties: false

    RegenerateRecoveryCodeRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
        code:
          type: string
          description: Current 6-digit TOTP code. Required when the account has TOTP enabled; ignored otherwise.
      required: [current_password]
      additionalProperties: false

    RecoveryCodeResponse:
      type: object
      properties:
        recovery_code:
          type: string
          description: New plaintext recovery code. Shown once; store it out of band.
      required: [recovery_code]
      additionalProperties: false

    TOTPEnrollRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
      required: [current_password]
      additionalProperties: false

    TOTPEnrollmentStart:
      type: object
      properties:
        secret_base32:
          type: string
          description: Base32-encoded TOTP secret for manual entry into an authenticator app.
        provisioning_uri:
          type: string
          description: otpauth:// URI for QR-code enrollment, embedding the configured TOTP_ISSUER label.
      required: [secret_base32, provisioning_uri]
      additionalProperties: false

    TOTPEnabledResponse:
      type: object
      properties:
        status:
          type: string
          enum: [totp_enabled]
        recovery_code:
          type: string
          description: New plaintext recovery code replacing the previous one. Shown once; store it out of band.
      required: [status, recovery_code]
      additionalProperties: false

    TOTPVerifyRequest:
      type: object
      properties:
        code:
          type: string
          description: Current 6-digit code from the authenticator app for the pending secret.
      required: [code]
      additionalProperties: false

    TOTPDisableRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
        code:
          type: string
          description: Current 6-digit code from the enrolled authenticator app.
      required: [current_password, code]
      additionalProperties: false

    TOTPChallengeRequest:
      type: object
      properties:
        challenge_id:
          type: string
          description: challenge_id from the totp_challenge object returned by POST /auth/login.
        code:
          type: string
          description: Current 6-digit code from the enrolled authenticator app.
      required: [challenge_id, code]
      additionalProperties: false

    AuthTOTPChallenge:
      type: object
      description: Present on AuthResult only when password verification succeeded but the account has TOTP enabled. The session fields are then emitted empty (`session_token` is `""`, `session_expires_at` is the zero time), not absent.
      properties:
        challenge_id:
          type: string
        challenge_expires_at:
          type: string
          format: date-time
      required: [challenge_id, challenge_expires_at]
      additionalProperties: false

    AuthResult:
      type: object
      description: |
        Returned by register, login, the TOTP login challenge, and the
        managed-bridge session endpoint. Either the session_token/
        session_expires_at pair is populated, or totp_challenge is populated
        (login only) — never both. `session_token` and `session_expires_at`
        are always emitted: on a TOTP challenge they are `""` and
        `0001-01-01T00:00:00Z`, so a client must discriminate on the presence
        of `totp_challenge`, not on the presence of the session fields.
      properties:
        account_id:
          type: string
        session_token:
          type: string
          description: "Opaque bearer token for Authorization: Bearer <token>. Empty string when totp_challenge is present."
        session_expires_at:
          type: string
          format: date-time
          description: Session expiry. The zero time `0001-01-01T00:00:00Z` when totp_challenge is present.
        recovery_code:
          type: string
          description: Plaintext account-level recovery code. Populated only on the register response.
        totp_challenge:
          $ref: "#/components/schemas/AuthTOTPChallenge"
      required: [account_id, session_token, session_expires_at]
      additionalProperties: false

    ForgotPasswordResult:
      type: object
      properties:
        reset_token:
          type: string
          description: Plaintext single-use token; carry it to /auth/reset-password.
        reset_token_expires_at:
          type: string
          format: date-time
      required: [reset_token, reset_token_expires_at]
      additionalProperties: false

    PasswordResetResult:
      type: object
      properties:
        recovery_code:
          type: string
          description: Freshly rotated plaintext recovery code, shown once.
      required: [recovery_code]
      additionalProperties: false

    AccountSessionView:
      type: object
      description: GET /auth/session response — minimal account-scoped state for the authenticated caller.
      properties:
        account_id:
          type: string
        login:
          type: string
        totp_enabled:
          type: boolean
      required: [account_id, login, totp_enabled]
      additionalProperties: false

    ManagedSessionRequest:
      type: object
      properties:
        account_id:
          type: string
          description: Opaque managed-account identifier; trimmed of ASCII whitespace only, it must match `^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$` (ASCII only — a non-ASCII id answers 400 `invalid_managed_account` even where lowercasing would fold it into ASCII), then is lowercased server-side.
      required: [account_id]
      additionalProperties: false

    ManagedAccountPremiumRequest:
      type: object
      properties:
        active:
          type: boolean
          description: 'false records an entitlement lapse (clears premium_active, revokes sessions); true reactivates after one (clears the marker without touching premium_active or sessions). Required; a body without it (including `{}` and `null`) is refused with 400 `invalid_entitlement_signal`.'
        as_of:
          type: string
          format: date-time
          description: The managed service's observation instant, used to order signals. Required for both a lapse and a reactivation.
      required: [active, as_of]
      additionalProperties: false

    CapabilityDocument:
      type: object
      properties:
        mode:
          type: string
          description: '"self_hosted" or "managed".'
        sync_enabled:
          type: boolean
        premium_active:
          type: boolean
        recovery_supported:
          type: boolean
        push_supported:
          type: boolean
        portal_supported:
          type: boolean
        advanced_cloud_insights:
          type: boolean
        max_devices:
          type: integer
        max_blob_bytes:
          type: integer
          format: int64
        atomic_rekey:
          type: boolean
          description: True when `PUT /sync/rekey` is offered. Absent on older servers; clients then use `PUT /sync/recovery-key` followed by `PUT /sync/blob`.
      required:
        - mode
        - sync_enabled
        - premium_active
        - recovery_supported
        - push_supported
        - portal_supported
        - advanced_cloud_insights
        - max_devices
        - max_blob_bytes
      additionalProperties: false

    DeviceRequest:
      type: object
      properties:
        device_id:
          type: string
          maxLength: 128
          description: 8 to 128 bytes (UTF-8, not characters; `maxLength` is a hint) after trimming; otherwise 400 `invalid_device`.
        device_label:
          type: string
          maxLength: 64
          description: 2 to 64 bytes (UTF-8, not characters; `maxLength` is a hint) after trimming; otherwise 400 `invalid_device`.
      required: [device_id, device_label]
      additionalProperties: false

    Device:
      type: object
      properties:
        device_id:
          type: string
        device_label:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
      required: [device_id, device_label, created_at, last_seen_at]
      additionalProperties: false

    DeviceListResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
      required: [devices]
      additionalProperties: false

    BlobPutRequest:
      type: object
      properties:
        schema_version:
          type: integer
          description: Must be positive.
        generation:
          type: integer
          format: int64
          description: Must be positive, strictly greater than the currently stored generation, and at most 15 minutes (in milliseconds) ahead of server time. A stored generation above that bound (left by an earlier release) does not count; any valid write replaces it.
        checksum_sha256:
          type: string
          description: Lowercase hex SHA-256 of the decoded ciphertext; 64 hex characters.
          pattern: "^[a-f0-9]{64}$"
        ciphertext_base64:
          type: string
          format: byte
          description: Opaque base64-encoded ciphertext. Server never decrypts or inspects contents; only size and checksum are validated.
        expected_generation:
          type: [integer, "null"]
          format: int64
          description: Optional. The generation the client last read or wrote. When present it must be positive, and the write commits only while the stored generation equals it; otherwise 409 `stale_generation` and nothing is written. A server older than this field rejects the body as `400 invalid_json` (unknown field).
      required: [schema_version, generation, checksum_sha256, ciphertext_base64]
      additionalProperties: false

    RekeyRecoveryKeyPackage:
      type: object
      description: The package fields and checks of RecoveryKeyPackageRequest, without its step-up fields (they ride at the top of RekeyRequest). The bridge's `expected_phrase_fingerprint_hex` is not accepted here; like any unknown field it answers `400 invalid_json`.
      properties:
        algorithm:
          type: string
          description: 'Must be exactly "xchacha20poly1305" (case-insensitive, normalized to lowercase).'
        kdf:
          type: string
          description: 'Must be exactly "bip39_seed_hkdf_sha256" (case-insensitive, normalized to lowercase).'
        mnemonic_word_count:
          type: integer
          description: Must be exactly 12.
        wrap_nonce_hex:
          type: string
          description: Lowercase hex, exactly 48 characters.
          pattern: "^[a-f0-9]{48}$"
        wrapped_master_key_hex:
          type: string
          description: Lowercase hex, exactly 96 characters (a 32-byte key plus its 16-byte tag).
          pattern: "^[a-f0-9]{96}$"
        phrase_fingerprint_hex:
          type: string
          description: Lowercase hex, exactly 16 characters.
          pattern: "^[a-f0-9]{16}$"
      required:
        - algorithm
        - kdf
        - mnemonic_word_count
        - wrap_nonce_hex
        - wrapped_master_key_hex
        - phrase_fingerprint_hex
      additionalProperties: false

    RekeyBlob:
      type: object
      description: The blob part of `RekeyRequest`; fields and validation as in `BlobPutRequest`, without `expected_generation`.
      properties:
        schema_version:
          type: integer
        generation:
          type: integer
          format: int64
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        ciphertext_base64:
          type: string
          format: byte
      required: [schema_version, generation, checksum_sha256, ciphertext_base64]
      additionalProperties: false

    RekeyRequest:
      type: object
      properties:
        recovery_key:
          $ref: "#/components/schemas/RekeyRecoveryKeyPackage"
        blob:
          $ref: "#/components/schemas/RekeyBlob"
        expected_generation:
          type: integer
          format: int64
          minimum: 0
          description: Required. `0` = no blob is stored yet; a positive value must equal the stored generation.
        current_password:
          type: string
          description: Required when the package differs from the stored one on an account with a password.
        code:
          type: string
          description: Current TOTP code; required when the package differs on a TOTP-enrolled account.
      required: [recovery_key, blob, expected_generation]
      additionalProperties: false

    RekeyResponse:
      type: object
      properties:
        recovery_key:
          $ref: "#/components/schemas/RecoveryKeyPackageResponse"
        blob:
          $ref: "#/components/schemas/BlobResponse"
      required: [recovery_key, blob]
      additionalProperties: false

    BlobResponse:
      type: object
      properties:
        schema_version:
          type: integer
        generation:
          type: integer
          format: int64
        checksum_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        ciphertext_base64:
          type: string
          format: byte
          description: Opaque base64-encoded ciphertext.
        ciphertext_size:
          type: integer
          description: Decoded ciphertext length in bytes.
        updated_at:
          type: string
          format: date-time
      required:
        - schema_version
        - generation
        - checksum_sha256
        - ciphertext_base64
        - ciphertext_size
        - updated_at
      additionalProperties: false

    RecoveryKeyPackageRequest:
      type: object
      description: Client-wrapped master-key package. Every field is opaque to the server beyond the format checks noted per field.
      properties:
        algorithm:
          type: string
          description: 'Must be exactly "xchacha20poly1305" (case-insensitive, normalized to lowercase).'
        kdf:
          type: string
          description: 'Must be exactly "bip39_seed_hkdf_sha256" (case-insensitive, normalized to lowercase).'
        mnemonic_word_count:
          type: integer
          description: Must be exactly 12.
        wrap_nonce_hex:
          type: string
          description: Lowercase hex, exactly 48 characters.
          pattern: "^[a-f0-9]{48}$"
        wrapped_master_key_hex:
          type: string
          description: Lowercase hex, exactly 96 characters (a 32-byte key plus its 16-byte tag). A package stored under the former at-least-64 rule is still returned by reads and by its identical re-put.
          pattern: "^[a-f0-9]{96}$"
        phrase_fingerprint_hex:
          type: string
          description: Lowercase hex, exactly 16 characters.
          pattern: "^[a-f0-9]{16}$"
        current_password:
          type: string
          format: password
          description: Required for self-hosted accounts unless the package equals the stored one; ignored for managed accounts. Never stored or echoed.
        code:
          type: string
          description: Current 6-digit TOTP code. Required when the account has TOTP enabled, unless the package equals the stored one; ignored otherwise.
      required:
        - algorithm
        - kdf
        - mnemonic_word_count
        - wrap_nonce_hex
        - wrapped_master_key_hex
        - phrase_fingerprint_hex
      additionalProperties: false

    ManagedRecoveryKeyPackageRequest:
      type: object
      description: The bridge re-key body. The package fields and checks of RecoveryKeyPackageRequest, without its step-up fields, plus the optional expected fingerprint; an unknown field is refused.
      properties:
        algorithm:
          type: string
          description: 'Must be exactly "xchacha20poly1305" (case-insensitive, normalized to lowercase).'
        kdf:
          type: string
          description: 'Must be exactly "bip39_seed_hkdf_sha256" (case-insensitive, normalized to lowercase).'
        mnemonic_word_count:
          type: integer
          description: Must be exactly 12.
        wrap_nonce_hex:
          type: string
          description: Lowercase hex, exactly 48 characters.
          pattern: "^[a-f0-9]{48}$"
        wrapped_master_key_hex:
          type: string
          description: Lowercase hex, exactly 96 characters (a 32-byte key plus its 16-byte tag).
          pattern: "^[a-f0-9]{96}$"
        phrase_fingerprint_hex:
          type: string
          description: Lowercase hex, exactly 16 characters.
          pattern: "^[a-f0-9]{16}$"
        expected_phrase_fingerprint_hex:
          type: [string, "null"]
          description: Optional. The `phrase_fingerprint_hex` of the package this re-key replaces, 16 hex characters (case-insensitive, normalized to lowercase). When present the write commits only while the stored package carries it; otherwise 409 `recovery_key_conflict` and nothing is written. A server older than this field rejects the body as `400 invalid_json` (unknown field).
      required:
        - algorithm
        - kdf
        - mnemonic_word_count
        - wrap_nonce_hex
        - wrapped_master_key_hex
        - phrase_fingerprint_hex
      additionalProperties: false

    RecoveryKeyPackageResponse:
      type: object
      properties:
        algorithm:
          type: string
        kdf:
          type: string
        mnemonic_word_count:
          type: integer
        wrap_nonce_hex:
          type: string
        wrapped_master_key_hex:
          type: string
        phrase_fingerprint_hex:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - algorithm
        - kdf
        - mnemonic_word_count
        - wrap_nonce_hex
        - wrapped_master_key_hex
        - phrase_fingerprint_hex
        - updated_at
      additionalProperties: false
